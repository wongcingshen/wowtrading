name: Collect auction snapshot

on:
  schedule:
    - cron: "7 * * * *"      # every hour, 7 minutes past
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore previous raw snapshot (used to estimate sales)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prev-raw-${{ github.run_id }}
          restore-keys: prev-raw-
      - name: Collect, score, alert
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m collector.run
      - name: Save raw snapshot for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: prev-raw-${{ github.run_id }}
      - name: Commit data
        run: |
          git config user.name "wowtrading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:00Z)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
